<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Hong Seh Job Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: an A4-proportioned document on a grey desk. Print stylesheet strips everything but the sheet. */
:root{--ink:#000;--body:#444;--mute:#767676;--line:#d9d9d9;--paper:#fff;--desk:#eceeef;--ok:#13795b;--att:#b91c1c;--link:#026e9f;--font:"Montserrat","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--desk);color:var(--body);font-family:var(--font);font-size:13px;line-height:1.55}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.bar{max-width:820px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px}
.sheet{max-width:820px;margin:12px auto 48px;background:var(--paper);box-shadow:0 6px 24px rgba(0,0,0,.08);padding:40px clamp(18px,5vw,48px)}
.top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:18px}
.co{display:flex;gap:14px;align-items:center}
.co svg{width:56px;height:auto}
.co b{display:block;color:var(--ink);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.co span{font-size:11.5px;color:var(--mute)}
.doc{text-align:right}
.doc h1{margin:0;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.doc p{margin:2px 0 0;font-variant-numeric:tabular-nums}
.paid{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:2px solid currentColor;border-radius:3px;padding:3px 8px}
.paid.yes{color:var(--ok)}.paid.no{color:var(--att)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}
.cols h2{margin:0 0 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.cols p{margin:0;color:var(--ink)}
@media (max-width:600px){.cols{grid-template-columns:1fr}.doc{text-align:left}}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:18px;min-width:520px}
th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:0 8px 8px 0;border-bottom:2px solid var(--ink)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top}
.r{text-align:right;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--mute)}
.tot{margin-left:auto;margin-top:14px;max-width:320px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums}
.tot dt{color:var(--body)}.tot dd{margin:0;text-align:right;color:var(--ink);font-weight:600}
.tot .g{border-top:2px solid var(--ink);padding-top:6px;font-size:15px}
.sec{margin-top:26px}
.sec h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin:0 0 8px}
.sec ul{margin:0;padding-left:18px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:36px}
.sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:11.5px;color:var(--mute)}
.foot{margin-top:28px;font-size:11px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.missing{max-width:520px;margin:80px auto;background:#fff;padding:28px;text-align:center}
@media print{
  body{background:#fff}.bar{display:none}.sheet{box-shadow:none;margin:0;max-width:none;padding:0}
  @page{size:A4;margin:16mm}
}
</style>
</head>
<body>
<div class="bar"><a id="back" href="track.html">← Back to tracker</a><span>Printable job card. In a normal browser, use Print → Save as PDF.</span></div>
<main id="out"></main>

<script src="data/tracker-config.js"></script>
<script src="data/demo-jobs.js"></script>
<script src="js/store.js"></script>
<script>
(function(){
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => 'S$' + Number(n).toLocaleString('en-SG', {minimumFractionDigits:2, maximumFractionDigits:2});
  const fmt = iso => iso ? new Date(iso).toLocaleString('en-SG', {day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit'}) : '—';
  function render(){
    const code = decodeURIComponent(location.hash.slice(1));
    const job = HSStore.find(code);
    const out = document.getElementById('out');
    if (!job) { out.innerHTML = `<div class="missing"><p>No job card found. Open it from your repair tracker.</p><p><a href="track.html">Go to the tracker</a></p></div>`; return; }
    document.getElementById('back').href = 'track.html#' + job.code;
    const lines = job.quote.filter(l => l.status === 'approved');
    const gross = lines.reduce((a, l) => a + l.unit * l.qty, 0);
    const insurer = lines.filter(l => l.payer === 'Insurer').reduce((a, l) => a + l.unit * l.qty, 0);
    const you = lines.filter(l => l.payer === 'You').reduce((a, l) => a + l.unit * l.qty, 0);
    const gst = you - you / (1 + HS_CONFIG.gstRate);
    const paid = job.payment.status === 'paid';
    out.innerHTML = `<article class="sheet">
      <div class="top">
        <div class="co"><svg viewBox="0 0 120 100" aria-hidden="true"><polygon points="4,4 116,4 60,96" fill="#d7272f"/><polygon points="14,10 106,10 60,86" fill="none" stroke="#fff" stroke-width="2.4"/><text x="60" y="34" text-anchor="middle" font-family="Montserrat,Arial" font-size="15" font-weight="600" fill="#fff">HONG</text><text x="60" y="52" text-anchor="middle" font-family="Montserrat,Arial" font-size="15" font-weight="600" fill="#fff">SEH</text></svg>
          <div><b>Hong Seh Motors · Aftersales</b><span>[Workshop address] · GST reg. [number] · +65 6xxx xxxx</span></div></div>
        <div class="doc"><h1>Job card &amp; tax invoice</h1><p>Job ${esc(job.code)}</p><p>Invoice INV-${esc(job.code.slice(3))}</p><p>${fmt(job.stageTimes.ready || new Date().toISOString())}</p><span class="paid ${paid ? 'yes' : 'no'}">${paid ? 'Paid · ' + esc(job.payment.ref) : 'Unpaid'}</span></div>
      </div>
      <div class="cols">
        <div><h2>Customer</h2><p>${esc(job.customer)}</p><p>Attn: ${esc(job.contact)}</p></div>
        <div><h2>Vehicle</h2><p>${esc(job.plate)}</p><p>${esc(job.model)} (electric)</p><p>${job.odometer.toLocaleString('en-SG')} km</p></div>
        <div><h2>Job</h2><p>${esc(job.serviceType)}</p><p>Technician: ${esc(job.technician.name)}</p><p>Advisor: ${esc(job.advisor.name)}</p></div>
      </div>
      <div class="tw"><table>
        <thead><tr><th>Item</th><th>Type</th><th class="r">Hours</th><th>Paid by</th><th class="r">Amount</th></tr></thead>
        <tbody>${lines.map(l => `<tr><td>${esc(l.desc)}${l.reason ? `<small>${esc(l.reason)}</small>` : ''}</td><td>${l.kind === 'part' ? 'Part ×' + l.qty : 'Labour'}</td><td class="r">${l.hours || '—'}</td><td>${esc(l.payer)}</td><td class="r">${l.unit ? money(l.unit * l.qty) : (l.payer === 'Warranty' ? 'Warranty' : 'No charge')}</td></tr>`).join('')}</tbody>
      </table></div>
      <dl class="tot">
        <dt>Total work</dt><dd>${money(gross)}</dd>
        ${insurer ? `<dt>Paid by insurer</dt><dd>−${money(insurer)}</dd>` : ''}
        <dt>GST included (${Math.round(HS_CONFIG.gstRate * 100)}%)</dt><dd>${money(gst)}</dd>
        <dt class="g">Amount payable by you</dt><dd class="g">${money(you)}</dd>
      </dl>
      <div class="sec"><h2>EV checks on this visit</h2><ul>
        <li>Battery health ${job.battery.soh}% of original capacity (warranty threshold 70%)</li>
        <li>Charging port: ${esc(job.battery.chargePort)}</li>
        <li>Software: ${job.battery.software.from === job.battery.software.to ? esc(job.battery.software.to) + ', up to date' : esc(job.battery.software.from) + ' → ' + esc(job.battery.software.to)}</li>
      </ul></div>
      <div class="sec"><h2>Warranty &amp; next service</h2><p>Vehicle: ${esc(job.warranty.vehicle)}. Battery: ${esc(job.warranty.battery)}.<br>Next service due: ${esc(job.nextService)}.</p></div>
      <div class="sec"><h2>Pickup checklist</h2><ul>${HS_CONFIG.pickupChecklist.map((c, i) => `<li>${job.checklist[i] ? '☑' : '☐'} ${esc(c)}</li>`).join('')}</ul></div>
      <div class="sign"><div>Released by (Hong Seh)</div><div>Received by (customer)</div></div>
      <p class="foot">Concept prototype by SMU MGMT319 Group 2. Demo document, not a real invoice.</p>
    </article>`;
  }
  render();
  window.addEventListener('hashchange', render);
  HSStore.onChange(render);
})();
</script>
</body>
</html>
